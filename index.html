<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🃏 Agile Poker — Real-Time Story Point Estimation</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="🃏 Agile Poker — Real-Time Story Point Estimation">
  <meta name="description" content="Estimate stories together in style! Real-time multiplayer Planning Poker with consensus celebrations, custom avatars, and agile trivia for high-performing scrum teams.">
  <meta name="keywords" content="planning poker, scrum poker, agile estimation, story points, sprint planning, scrum master, agile tools, team estimation, multiplayer planning poker">
  <meta name="author" content="Agile Poker">
  <meta name="robots" content="index, follow">

  <!-- Theme & Mobile Embed Styling -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="msapplication-TileColor" content="#4f46e5">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agile Poker">

  <!-- Open Graph / Facebook / LinkedIn / Teams / Discord -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Agile Poker">
  <meta property="og:title" content="🃏 Agile Poker — Real-Time Scrum & Story Point Estimation">
  <meta property="og:description" content="Estimate stories together in style! Real-time multiplayer Planning Poker with consensus confetti, custom avatars, and agile trivia.">
  <meta property="og:image" content="./og-preview.jpg">
  <meta property="og:image:secure_url" content="./og-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:image:alt" content="Agile Poker - Real-Time Scrum & Story Point Estimation for Agile Teams">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🃏 Agile Poker — Real-Time Story Point Estimation">
  <meta name="twitter:description" content="Estimate stories together in style! Real-time multiplayer Planning Poker with consensus animations, custom avatars, and agile trivia.">
  <meta name="twitter:image" content="./og-preview.jpg">
  <meta name="twitter:image:alt" content="Agile Poker table preview with story point cards">

  <!-- Icons & Preconnects -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/lobby.css">
  <link rel="stylesheet" href="./src/styles/table.css">
  <link rel="stylesheet" href="./src/styles/cards.css">
  <link rel="stylesheet" href="./src/styles/players.css">
  <link rel="stylesheet" href="./src/styles/reveal.css">
</head>

<body>
  <div id="app">
    <!-- Lobby View -->
    <div id="lobby" class="view active">
      <div class="lobby-container">
        <div class="logo-section">
          <div class="logo-card">🃏</div>
          <h1 class="logo-title">Agile Poker</h1>
          <p class="logo-subtitle">Estimate stories together, in style</p>
          <div id="connectionStatus" class="connection-status connecting">
            <span class="status-dot"></span>
            <span class="status-text">Connecting...</span>
          </div>
        </div>

        <div class="lobby-actions">
          <div class="action-card create-room">
            <h2>Host a Game</h2>
            <p>Create a new room and invite your team</p>
            <input type="text" id="hostName" placeholder="Your name" maxlength="20">
            <button id="createRoomBtn" class="btn btn-primary">
              <span class="btn-text">Create Room</span>
              <span class="btn-icon">→</span>
            </button>
          </div>

          <div class="divider">
            <span>or</span>
          </div>

          <div class="action-card join-room">
            <h2>Join a Game</h2>
            <p>Enter the room code to join</p>
            <input type="text" id="playerName" placeholder="Your name" maxlength="20">
            <input type="text" id="roomCode" placeholder="Room code (e.g. ABC1)" maxlength="4">
            <button id="joinRoomBtn" class="btn btn-secondary">
              <span class="btn-text">Join Room</span>
              <span class="btn-icon">→</span>
            </button>
          </div>
        </div>

        <div id="errorMessage" class="error-message"></div>
      </div>

      <div class="ambient-glow"></div>
    </div>

    <!-- Game View -->
    <div id="game" class="view">
      <div class="game-header">
        <div class="room-info">
          <span class="room-label">Room</span>
          <span id="roomCodeDisplay" class="room-code"></span>
          <button id="copyRoomCode" class="copy-btn" title="Copy room code">📋</button>
        </div>
        <div class="header-actions">
          <div class="game-status">
            <span id="gameStatus" class="status-badge">Waiting</span>
          </div>
          <button id="soundToggleBtn" class="sound-toggle-btn" title="Toggle Sound FX">
            <span class="sound-icon">🔊</span>
          </button>
          <button id="exitRoomBtn" class="exit-btn" title="Leave room">🚪 Exit</button>
        </div>
      </div>

      <!-- Agile Trivia Ticker Banner -->
      <div id="triviaBanner" class="trivia-banner hidden">
        <span class="trivia-icon">💡</span>
        <span id="triviaTicker" class="trivia-ticker-text"></span>
      </div>

      <div class="poker-arena">
        <div class="poker-table">
          <div class="table-felt">
            <div class="table-logo">🃏</div>
            <div id="tableCenter" class="table-center">
              <div class="waiting-text">Waiting to start...</div>
            </div>
          </div>
          <div id="playersContainer" class="players-container"></div>
        </div>
      </div>

      <div id="cardDeck" class="card-deck hidden">
        <div class="deck-header">
          <div class="deck-label">Choose your estimate</div>
        </div>
        <div id="deckCards" class="deck-cards"></div>
      </div>

      <div id="hostControls" class="host-controls hidden">
        <button id="startRoundBtn" class="btn btn-primary btn-large">
          <span class="btn-icon">▶</span>
          <span class="btn-text">Start Round</span>
        </button>
        <button id="revealCardsBtn" class="btn btn-accent btn-large hidden">
          <span class="btn-icon">👁</span>
          <span class="btn-text">Reveal Cards</span>
        </button>
        <button id="newRoundBtn" class="btn btn-secondary btn-large hidden">
          <span class="btn-icon">🔄</span>
          <span class="btn-text">New Round</span>
        </button>
        <button id="hostModeToggle" class="btn btn-outline btn-large hidden"
          title="If enabled, auto-reveal when others vote">
          <span class="btn-icon">👮</span>
          <span class="btn-text">Ignore my vote</span>
        </button>
      </div>

      <!-- Reveal overlay -->
      <div id="revealOverlay" class="reveal-overlay hidden">
        <div class="reveal-spotlight"></div>
        <div id="revealCards" class="reveal-cards"></div>
      </div>
    </div>
  </div>

  <!-- Avatar Customizer Modal -->
  <div id="avatarModal" class="modal-overlay hidden">
    <div class="modal-container avatar-modal">
      <div class="modal-header">
        <h3>Customize Avatar</h3>
        <button id="closeAvatarModal" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Live Preview -->
        <div class="avatar-preview-section">
          <div id="avatarPreview" class="avatar-preview-lg">
            <span id="avatarPreviewEmoji" class="avatar-emoji">🐱</span>
          </div>
          <button id="modalRerollBtn" class="btn btn-secondary btn-sm">
            <span>🎲</span> Shuffle Random
          </button>
        </div>

        <!-- Category Tabs -->
        <div class="emoji-tabs">
          <button class="tab-btn active" data-tab="animals">🐱 Animals</button>
          <button class="tab-btn" data-tab="tech">🚀 Sci-Fi & Tech</button>
          <button class="tab-btn" data-tab="food">🍕 Food & Treats</button>
          <button class="tab-btn" data-tab="fun">😎 Expressive</button>
        </div>

        <!-- Emoji Grid -->
        <div id="emojiGrid" class="emoji-grid"></div>

        <!-- Gradient Palette -->
        <div class="palette-section-title">Background Theme</div>
        <div id="gradientPalette" class="gradient-palette"></div>
      </div>
      <div class="modal-footer">
        <button id="saveAvatarBtn" class="btn btn-primary btn-block">Save Avatar</button>
      </div>
    </div>
  </div>

  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
